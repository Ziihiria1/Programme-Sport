<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap');

:root{
  --bg:#0E0E10;
  --panel:#18171B;
  --panel-2:#201F24;
  --line:#2C2A30;
  --text:#F0EDE8;
  --muted:#928F94;
  --accent:#E6432C;
  --accent-dim:#3D1712;
  --green:#4C8C6B;
  --amber:#D98A3D;
  --amber-bg:#3A2C17;
}
html[data-theme="light"]{
  --bg:#F5F6F7;
  --panel:#FFFFFF;
  --panel-2:#F0EFEC;
  --line:#DCDAD7;
  --text:#16151A;
  --muted:#6B6870;
  --accent:#D8371F;
  --accent-dim:#FBE3DF;
  --green:#2F7A54;
  --amber:#B9711F;
  --amber-bg:#FCEEDA;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Roboto',sans-serif;
  font-size:15px;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  transition:background-color .15s ease, color .15s ease;
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important;}
}
#app{max-width:520px;margin:0 auto;padding:0 14px calc(100px + env(safe-area-inset-bottom));}

.sticky-top{
  position:sticky;top:0;background:var(--bg);z-index:10;
  padding:14px 0 12px;border-bottom:1px solid var(--line);margin-bottom:14px;
}
.eyebrow{
  font-family:'Roboto',sans-serif;
  font-size:10.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
}
h1{
  font-family:'Roboto',sans-serif;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.005em;
  font-size:20px;
  margin:2px 0 2px;
}
h2{
  font-family:'Roboto',sans-serif;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:0;
  font-size:17px;
  margin:0 0 4px;
}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 14px;}

.header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.header-right{display:flex;align-items:center;gap:8px;}
.streak-badge{
  display:flex;align-items:center;gap:4px;
  padding:7px 10px;border-radius:999px;
  background:var(--panel-2);border:1px solid var(--line);
  font-family:'Roboto',sans-serif;font-size:12.5px;font-weight:700;color:var(--text);
  white-space:nowrap;
}
.theme-toggle{
  width:36px;height:36px;border-radius:50%;flex:0 0 auto;
  border:1.5px solid var(--line);background:var(--panel);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;color:var(--text);
}
.theme-toggle:active{background:var(--panel-2);}

.cycle-row{display:flex;gap:5px;margin-bottom:10px;}
.cycle-seg{
  flex:1;height:32px;border-radius:4px;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-family:'Roboto',sans-serif;font-size:12px;font-weight:500;
  color:var(--muted);background:var(--panel);
}
.cycle-seg.active{background:var(--accent-dim);border-color:var(--accent);color:var(--text);}
.cycle-seg.active.deload{background:var(--amber-bg);border-color:var(--amber);color:var(--amber);}

.week-nav{display:flex;gap:4px;flex:1;}
.week-nav-row{display:flex;align-items:stretch;gap:6px;}
.week-arrow{
  flex:0 0 auto;width:30px;border-radius:6px;
  border:1.5px solid var(--line);background:var(--panel);color:var(--muted);
  font-size:17px;cursor:pointer;
}
.week-arrow:active{background:var(--panel-2);}
.today-link{
  display:inline-block;margin-top:8px;padding:6px 12px;border-radius:999px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--accent);
  font-family:'Roboto',sans-serif;font-size:11.5px;cursor:pointer;font-weight:700;
}
.day-btn{
  flex:1;min-height:50px;background:var(--panel);border:1.5px solid var(--line);border-radius:6px;
  padding:8px 1px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;color:var(--muted);font-family:'Roboto',sans-serif;
}
.day-btn:active{background:var(--panel-2);}
.day-btn .dlabel{font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;font-weight:500;}
.day-btn .dnum{font-size:14px;font-weight:700;margin-top:2px;color:var(--text);}
.day-btn.today{border-color:var(--accent);}
.day-btn.selected{background:var(--accent-dim);border-color:var(--accent);}
.day-dot{width:5px;height:5px;border-radius:50%;background:var(--green);margin-top:5px;visibility:hidden;}
.day-btn.done .day-dot{visibility:visible;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px;margin-bottom:12px;}
.ex-hero-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px;}
.ex-hero-top{padding:16px;background:linear-gradient(135deg, var(--accent-dim), var(--panel) 75%);}
.ex-hero-icon-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.ex-hero-icon{width:38px;height:38px;border-radius:11px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}

function pad(n){return String(n).padStart(2,'0');}
function toDateStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseDateStr(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}

  const out = [];

      if(k && k.startsWith(LS_PREFIX+prefix)) out.push(k.slice(LS_PREFIX.length));

}

function cycleWeekFor(dateObj, programStart){
  const mon = getMonday(dateObj);
  const startMon = getMonday(parseDateStr(programStart));
  const weeks = Math.floor((mon - startMon) / (7*86400000));
  return ((weeks % 4) + 4) % 4 + 1;
}
function sessionFor(dateObj, cycleWeek){
  const dow = dateObj.getDay();
  const base = PROGRAM[dow];
  if(base.type === 'CONDITIONNEMENT'){ return {...base, exercises: CONDITIONING_BY_WEEK[cycleWeek]}; }
  return base;
}
function weekDates(anchorDate){
  const mon = getMonday(anchorDate);
  const out = [];
  for(let i=0;i<7;i++){ const d=new Date(mon); d.setDate(mon.getDate()+i); out.push(d); }
  return out;
}
function isDayDoneSync(dateObj, rec){
  const dow = dateObj.getDay();
  const cw = cycleWeekFor(dateObj, state.profile.programStart);
  const fixed = (PROGRAM[dow].exercises || CONDITIONING_BY_WEEK[cw]);
  const fixedIds = fixed.map(e=>e.id);
  const checkedKeys = Object.keys(rec.checked||{}).filter(k=>rec.checked[k]);
  const fixedDone = checkedKeys.filter(k=>fixedIds.includes(k)).length;
  if(fixedIds.length>0 && fixedDone>=fixedIds.length) return true;
  const extraDone = checkedKeys.filter(k=>!fixedIds.includes(k)).length;
  return extraDone >= LIB_SESSION_MIN;
}
function computeMaxTrend(history){
  if(!history || history.length===0) return {line:'', plateau:false};
  const last5 = history.slice(-5);
  const line = last5.map(e=>e.max).join(' → ');
  let plateau = false;
  if(history.length>=3){
    const n = history.length;
    const a = history[n-3].max, b = history[n-2].max, c = history[n-1].max;
    plateau = (c<=b) && (b<=a);
  }
  return {line, plateau};
}
async function weekAdherence(anchorDate){
  const dates = weekDates(anchorDate);
  const results = await Promise.all(dates.map(async d=>{
    const ds = toDateStr(d);
    const rec = (ds === state.selectedDate && state.dayData) ? state.dayData : await loadDay(ds);
    return {date: ds, dow: d.getDay(), done: isDayDoneSync(d, rec)};
  }));
  return results;
}
async function computeStreakBase(){
  const days=[];
  const start=new Date(); start.setDate(start.getDate()-1);
  for(let i=0;i<30;i++){ const d=new Date(start); d.setDate(start.getDate()-i); days.push(d); }
  const recs = await Promise.all(days.map(d=>loadDay(toDateStr(d))));
  let streak=0;
  for(let i=0;i<days.length;i++){
    if(isDayDoneSync(days[i], recs[i])) streak++;
    else break;
  }
  return streak;
}
async function getTodayDoneNow(){
  const ds = todayStr();
  const rec = (state.selectedDate===ds && state.dayData) ? state.dayData : await loadDay(ds);
  return isDayDoneSync(new Date(), rec);
}
async function evaluatePerfectWeeksIfNeeded(){
  const thisMonday = toDateStr(getMonday(new Date()));
  if(state.profile.lastEvaluatedWeekMonday === thisMonday) return;
  let cursorMonday;
  if(state.profile.lastEvaluatedWeekMonday){
    cursorMonday = parseDateStr(state.profile.lastEvaluatedWeekMonday);
    cursorMonday.setDate(cursorMonday.getDate()+7);
  } else {
    cursorMonday = getMonday(parseDateStr(state.profile.programStart));
  }
  let changed=false, safety=0;
  while(toDateStr(cursorMonday) < thisMonday && safety<26){
    const dates=[]; for(let i=0;i<7;i++){ const d=new Date(cursorMonday); d.setDate(cursorMonday.getDate()+i); dates.push(d); }
    const recs = await Promise.all(dates.map(d=>loadDay(toDateStr(d))));
    const allDone = dates.every((d,i)=>isDayDoneSync(d, recs[i]));
    if(allDone){ state.profile.perfectWeeks = (state.profile.perfectWeeks||0)+1; }
    state.profile.lastEvaluatedWeekMonday = toDateStr(cursorMonday);
    changed = true;
    cursorMonday.setDate(cursorMonday.getDate()+7);
    safety++;
  }
  if(changed) await saveProfile(state.profile);
}
function renderMiniChart(history, key, color){
  if(!history || history.length===0) return `<p class="ex-detail">Pas encore de données.</p>`;
  const items = history.slice(-8);
  const vals = items.map(e=>e[key]);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max-min) || 1;
  const bars = items.map((e,i)=>{
    const v = e[key];
    const pct = 15 + ((v-min)/range)*85;
    const isLast = i === items.length-1;
    return `<div class="chart-bar-wrap"><div class="chart-bar" style="height:${pct}%;background:${isLast?color:'var(--panel-2)'}"></div><div class="chart-label">${fmtDate(e.date)}</div></div>`;
  }).join('');
  return `<div class="chart-row">${bars}</div>`;
}

function fmtMMSS(totalSec){
  const s = Math.max(0, Math.ceil(totalSec));
  const m = Math.floor(s/60);
  const sec = s%60;
  return pad(m)+':'+pad(sec);
}
function timerBeep(freq, dur){
  freq = freq||880; dur = dur||150;
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + dur/1000);
    osc.onended = ()=>ctx.close();
  }catch(e){ /* audio unavailable, ignore */ }
  if(navigator.vibrate){ try{ navigator.vibrate(150); }catch(e){} }
}
function timerStartPhase(){
  const t = state.timer;
  const durSec = t.phase==='work' ? t.workSec : t.restSec;
  t.endTimestamp = Date.now() + durSec*1000;
}
async function autoCheckConditioningIfDone(){
  const t = state.timer;
  if(t.rounds < 2) return false;
  const todayD = new Date();
  const dow = todayD.getDay();
  if(PROGRAM[dow].type !== 'CONDITIONNEMENT') return false;
  const ds = todayStr();
  const rec = (state.selectedDate===ds && state.dayData) ? state.dayData : await loadDay(ds);
  if(rec.checked['k1']) return false;
  const wasDone = isDayDoneSync(todayD, rec);
  rec.checked['k1'] = true;
  const nowDone = isDayDoneSync(todayD, rec);
  if(!wasDone && nowDone){
    state.profile.totalSessionsCompleted = (state.profile.totalSessionsCompleted||0)+1;
    await saveProfile(state.profile);
  }
  await saveDay(ds, rec);
  if(state.selectedDate===ds){ state.dayData = rec; }
  return true;
}
async function timerAdvance(){
  const t = state.timer;
  if(t.currentRound >= t.rounds){
    t.running = false; t.phase = 'done';
    if(timerHandle){ clearInterval(timerHandle); timerHandle=null; }
    timerBeep(1200,300);
    state.timerJustAutoChecked = await autoCheckConditioningIfDone();
  } else {
    t.currentRound++;
    t.phase = 'work';
    timerStartPhase();
  }
}
async function timerTick(){
  const t = state.timer;
  if(!t.running || t.paused) return;
  const remainingMs = t.endTimestamp - Date.now();
  if(remainingMs <= 0){
    timerBeep();
    if(t.phase==='work'){
      if(t.restSec>0){ t.phase='rest'; timerStartPhase(); }
      else { await timerAdvance(); }
    } else if(t.phase==='rest'){
      await timerAdvance();
    }
    await render();
    return;
  }
  const el = document.getElementById('timerDisplay');
  if(el) el.textContent = fmtMMSS(remainingMs/1000);
}

async function render(){
  const app = document.getElementById('app');
  const todayDoneNow = await getTodayDoneNow();
  state.liveStreak = state.streakBase + (todayDoneNow ? 1 : 0);
  if(state.liveStreak > (state.profile.longestStreak||0)){
    state.profile.longestStreak = state.liveStreak;
    await saveProfile(state.profile);
  }
  let headerHtml, contentHtml;
  if(state.page === 'dashboard'){ ({headerHtml, contentHtml} = await renderDashboardActionPage()); }
  else if(state.page === 'library'){ ({headerHtml, contentHtml} = await renderLibraryPage()); }
  else if(state.page === 'settings'){ ({headerHtml, contentHtml} = await renderSettingsPage()); }
  else if(state.page === 'timer'){ ({headerHtml, contentHtml} = await renderTimerPage()); }
  else { ({headerHtml, contentHtml} = await renderDashboardActionPage()); }
  app.innerHTML = headerHtml + contentHtml + bottomNavHtml();
  wireEvents();
}

function wireEvents(){
  const app = document.getElementById('app');
  app.onclick = async (e) => {
    if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;

    if(action === 'nav'){
      const newPage = el.dataset.page;
      if(state.page === 'timer' && newPage !== 'timer' && timerHandle){
        clearInterval(timerHandle); timerHandle = null;
      }
      state.page = newPage;
      await render();
      if(state.page === 'timer' && state.timer.running && !state.timer.paused && !timerHandle){
        timerHandle = setInterval(timerTick, 200);
        timerTick();
      }
    }
    else if(action === 'select-day'){
      state.selectedDate = el.dataset.date;
      state.dayData = await loadDay(state.selectedDate);
      await render();
    }
    else if(action === 'toggle-ex'){
      const id = el.dataset.id;
      const dateStr = el.dataset.date || state.selectedDate;
      const dateObj = parseDateStr(dateStr);
      const usesLiveDayData = (dateStr === state.selectedDate);
      const rec = usesLiveDayData ? state.dayData : await loadDay(dateStr);
      const wasDone = isDayDoneSync(dateObj, rec);
      rec.checked[id] = !rec.checked[id];
      const nowDone = isDayDoneSync(dateObj, rec);
      if(!wasDone && nowDone){ state.profile.totalSessionsCompleted = (state.profile.totalSessionsCompleted||0)+1; }
      else if(wasDone && !nowDone){ state.profile.totalSessionsCompleted = Math.max(0,(state.profile.totalSessionsCompleted||0)-1); }
      await saveDay(dateStr, rec);
      if(usesLiveDayData){ state.dayData = rec; }
      await saveProfile(state.profile);
      await render();
    }
    else if(action === 'gtg-add'){
      state.dayData.gtgSets = (state.dayData.gtgSets||0) + 1;
      state.profile.totalGtgSets = (state.profile.totalGtgSets||0) + 1;
      await saveDay(state.selectedDate, state.dayData);
      await saveProfile(state.profile);
      await render();
    }
    else if(action === 'gtg-reset'){
      state.dayData.gtgSets = 0;
      await saveDay(state.selectedDate, state.dayData);
      await render();
    }
    else if(action === 'save-max'){
      const input = document.getElementById('maxInput');
      const val = parseInt(input.value, 10);
      if(val && val > 0){
        state.profile.weeklyMax = val;
        state.profile.maxHistory = state.profile.maxHistory || [];
        const filtered = state.profile.maxHistory.filter(e=>e.date!==state.selectedDate);
        filtered.push({date: state.selectedDate, max: val});
        filtered.sort((a,b)=>a.date.localeCompare(b.date));
        state.profile.maxHistory = filtered.slice(-12);
        await saveProfile(state.profile);
        await render();
      }
    }
    else if(action === 'save-bw'){
      const input = document.getElementById('bwInput');
      const val = parseFloat(input.value);
      if(val && val > 0){
        await saveBodyweightEntry(state.selectedDate, val);
        await render();
      }
    }
    else if(action === 'toggle-theme'){
      state.profile.theme = state.profile.theme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', state.profile.theme);
      applyDynamicAccent();
      await saveProfile(state.profile);
      await render();
    }
    else if(action === 'timer-start'){
      const t = state.timer;
      t.currentRound = 1; t.phase = 'work'; t.running = true; t.paused = false;
      timerStartPhase();
      await render();
      if(timerHandle){ clearInterval(timerHandle); }
      timerHandle = setInterval(timerTick, 200);
      timerTick();
    }
    else if(action === 'timer-pause'){
      const t = state.timer;
      if(!t.paused){
        t.pausedRemainingMs = Math.max(0, t.endTimestamp - Date.now());
        t.paused = true;
        if(timerHandle){ clearInterval(timerHandle); timerHandle = null; }
      } else {
        t.endTimestamp = Date.now() + t.pausedRemainingMs;
        t.paused = false;
        timerHandle = setInterval(timerTick, 200);
        timerTick();
      }
      await render();
    }
    else if(action === 'timer-reset'){
      if(timerHandle){ clearInterval(timerHandle); timerHandle = null; }
      const t = state.timer;
      t.running = false; t.paused = false; t.phase = 'idle';
      t.currentRound = 1; t.endTimestamp = null; t.pausedRemainingMs = 0;
      await render();
    }
    else if(action === 'timer-preset'){
      state.timer.workSec = parseInt(el.dataset.work, 10);
      state.timer.restSec = parseInt(el.dataset.rest, 10);
      state.timer.rounds = parseInt(el.dataset.rounds, 10);
      await render();
    }
    else if(action === 'timer-load-conditioning'){
      const cw = cycleWeekFor(new Date(), state.profile.programStart);
      const presc = CONDITIONING_BY_WEEK[cw][0];
      state.timer.workSec = presc.workSec;
      state.timer.restSec = presc.restSec;
      state.timer.rounds = presc.rounds;
      await render();
    }
    else if(action === 'week-shift'){
      const dir = parseInt(el.dataset.dir, 10);
      const cur = parseDateStr(state.selectedDate);
      cur.setDate(cur.getDate() + dir*7);
      state.selectedDate = toDateStr(cur);
      state.dayData = await loadDay(state.selectedDate);
      await render();
    }
    else if(action === 'go-today'){
      state.selectedDate = todayStr();
      state.dayData = await loadDay(state.selectedDate);
      await render();
    }
    else if(action === 'import-data'){
      const ta = document.getElementById('importInput');
      const text = ta ? ta.value.trim() : '';
      if(!text){ alert('Colle d\'abord le JSON exporté dans le champ.'); }
      else {
        try{
          await importData(text);
          alert('Import réussi. Rechargement...');
          location.reload();
        }catch(e){
          alert("Le JSON semble invalide — vérifie que tu as bien copié tout le texte de l'export.");
          console.error(e);
        }
      }
    }
    else if(action === 'save-firstname'){
      const input = document.getElementById('firstNameInput');
      state.profile.firstName = input ? input.value.trim() : '';
      await saveProfile(state.profile);
      await render();
    }
    else if(action === 'set-equip-mode'){
      const mode = el.dataset.mode;
      state.dayData.equipMode = mode;
      await saveDay(state.selectedDate, state.dayData);
      await render();
    }
    else if(action === 'lib-tab'){
      state.libraryTab = el.dataset.tab;
      await render();
    }
    else if(action === 'export-data'){
      state.exportJson = JSON.stringify(await gatherExportData(), null, 2);
      await render();
    }
    else if(action === 'export-download'){
      try{
        const blob = new Blob([state.exportJson], {type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'programme-jjb-export.json';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }catch(e){ console.error('download failed', e); alert("Le téléchargement direct n'a pas fonctionné — copie le texte manuellement."); }
    }
    else if(action === 'export-copy'){
      try{
        await navigator.clipboard.writeText(state.exportJson);
        alert('Copié dans le presse-papiers.');
      }catch(e){
        alert("Copie automatique indisponible — sélectionne le texte manuellement.");
      }
    }
    else if(action === 'reset-all'){
      if(confirm('Effacer toutes les données enregistrées (profil + statistiques + historique) ?')){
        state.profile = {programStart: toDateStr(getMonday(new Date())), weeklyMax: 22, percent: 60, maxHistory: [], theme: state.profile.theme,
          totalGtgSets:0, totalSessionsCompleted:0, perfectWeeks:0, longestStreak:0, lastEvaluatedWeekMonday:null};
        await saveProfile(state.profile);
        state.selectedDate = todayStr();
        state.dayData = normalizeDay(null);
        state.streakBase = 0;
        await saveDay(state.selectedDate, state.dayData);
        await render();
      }
    }
  };
  app.onchange = async (e) => {
    if(e.target.id === 'timerWork'){ state.timer.workSec = Math.max(1, parseInt(e.target.value,10)||1); return; }
    if(e.target.id === 'timerRest'){ state.timer.restSec = Math.max(0, parseInt(e.target.value,10)||0); return; }
    if(e.target.id === 'timerRounds'){ state.timer.rounds = Math.max(1, parseInt(e.target.value,10)||1); return; }
    if(e.target.id === 'percentSelect'){
      state.profile.percent = parseInt(e.target.value, 10);
      await saveProfile(state.profile);
      await render();
    }
    else if(e.target.classList.contains('winput')){
      const exId = e.target.dataset.exid;
      const dateStr = e.target.dataset.date || state.selectedDate;
      const val = parseFloat(e.target.value);
      if(!isNaN(val) && val >= 0){
        const usesLiveDayData = (dateStr === state.selectedDate);
        const rec = usesLiveDayData ? state.dayData : await loadDay(dateStr);
        rec.weights = rec.weights || {};
        rec.weights[exId] = val;
        await saveDay(dateStr, rec);
        if(usesLiveDayData){ state.dayData = rec; }
        await saveWeightHist(exId, dateStr, val);
        await render();
      }
    }
  };
}

(async function init(){
  try{
    let profile = await loadProfile();
    if(!profile){
      profile = {programStart: toDateStr(getMonday(new Date())), weeklyMax: 22, percent: 60, maxHistory: [], theme: 'dark',
        totalGtgSets:0, totalSessionsCompleted:0, perfectWeeks:0, longestStreak:0, lastEvaluatedWeekMonday:null};
      await saveProfile(profile);
    }
    if(!profile.maxHistory) profile.maxHistory = [];
    if(!profile.theme) profile.theme = 'dark';
    if(profile.totalGtgSets==null) profile.totalGtgSets = 0;
    if(profile.totalSessionsCompleted==null) profile.totalSessionsCompleted = 0;
    if(profile.perfectWeeks==null) profile.perfectWeeks = 0;
    if(profile.longestStreak==null) profile.longestStreak = 0;
    document.documentElement.setAttribute('data-theme', profile.theme);
    state.profile = profile;
    applyDynamicAccent();
    state.welcomeMessage = pickWelcomeMessage();
    state.selectedDate = todayStr();
    state.dayData = await loadDay(state.selectedDate);
    await evaluatePerfectWeeksIfNeeded();
    state.streakBase = await computeStreakBase();
    await render();
  }catch(err){
    document.getElementById('app').innerHTML = '<p style="color:var(--accent);padding:20px;">Erreur de chargement. Recharge la page.</p>';
    console.error(err);
  }
})();
</script>
